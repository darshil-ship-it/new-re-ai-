{% extends "base.html" %}
{% block title %}Verify OTP - My-Review-AI{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20 px-4">
    <div class="bg-white p-8 rounded-lg shadow-md border border-border">
        <h2 class="text-2xl font-bold text-center text-primary mb-2">Verify OTP</h2>
        <p class="text-center text-muted mb-6">We sent a 6-digit code to <strong>{{ email }}</strong></p>
        
        <form action="/verify-otp" method="POST" class="space-y-4">
            <input type="hidden" name="email" value="{{ email }}">
            <div>
                <label for="token" class="block text-sm font-medium text-text mb-1">Enter OTP</label>
                <input type="text" name="token" id="token" required maxlength="6" pattern="[0-9]{6}" class="w-full px-3 py-2 border border-border rounded-md shadow-sm text-center text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" placeholder="000000">
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white font-medium py-2.5 px-4 rounded-md transition">
                Verify & Login
            </button>
        </form>
    </div>
</div>
{% endblock %}

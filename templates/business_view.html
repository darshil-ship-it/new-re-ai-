{% extends "dashboard_base.html" %}
{% block title %}My Business - My-Review-AI{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-lg shadow-md border border-border p-8">
        <h1 class="text-3xl font-bold text-primary mb-2">My Business</h1>
        <p class="text-muted mb-8">Manage your business information</p>
        
        <form action="/business/update" method="POST" class="space-y-6">
            <!-- Business Name -->
            <div>
                <label for="business_name" class="block text-sm font-medium text-text mb-1">Business Name <span class="text-danger">*</span></label>
                <input type="text" name="business_name" id="business_name" required value="{{ business.business_name }}"
                       class="w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
            </div>
            
            <!-- Location -->
            <div>
                <label for="location" class="block text-sm font-medium text-text mb-1">Business Location</label>
                <input type="text" name="location" id="location" value="{{ business.location or '' }}"
                       class="w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
            </div>
            
            <!-- Industry -->
            <div>
                <label for="industry_id" class="block text-sm font-medium text-text mb-1">Industry <span class="text-danger">*</span></label>
                <select name="industry_id" id="industry_id" required 
                        class="w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
                    <option value="">Select Industry</option>
                    {% for industry in industries %}
                    <option value="{{ industry.id }}" {% if business.industry_id == industry.id %}selected{% endif %}>{{ industry.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Business Type -->
            <div>
                <label for="business_type_id" class="block text-sm font-medium text-text mb-1">Business Type</label>
                <select name="business_type_id" id="business_type_id" 
                        class="w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
                    <option value="">Select Business Type</option>
                    <option value="other" {% if business.business_type_id is none and business.custom_business_type %}selected{% endif %}>Other</option>
                </select>
            </div>
            
            <!-- Custom Business Type -->
            <div id="custom_type_div" class="{% if business.custom_business_type %}{% else %}hidden{% endif %}">
                <label for="custom_business_type" class="block text-sm font-medium text-text mb-1">Specify Your Business Type</label>
                <input type="text" name="custom_business_type" id="custom_business_type" value="{{ business.custom_business_type or '' }}"
                       class="w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
            </div>
            
            <!-- Google Review URL -->
            <div>
                <label for="google_review_url" class="block text-sm font-medium text-text mb-1">Google Review URL</label>
                <input type="url" name="google_review_url" id="google_review_url" value="{{ business.google_review_url or '' }}"
                       class="w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
            </div>
            
            <!-- Keywords -->
            <div>
                <label for="keywords" class="block text-sm font-medium text-text mb-1">Keywords</label>
                <textarea name="keywords" id="keywords" rows="2" 
                          class="w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">{{ business.keywords or '' }}</textarea>
            </div>
            
            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-text mb-1">Business Description</label>
                <textarea name="description" id="description" rows="4" 
                          class="w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">{{ business.description or '' }}</textarea>
            </div>
            
            <!-- Submit Button -->
            <div class="pt-4 flex space-x-4">
                <button type="submit" class="flex-1 bg-primary hover:bg-primary-hover text-white font-medium py-3 px-4 rounded-md transition">
                    Update Business
                </button>
                <a href="/dashboard" class="flex-1 bg-surface hover:bg-gray-200 text-text font-medium py-3 px-4 rounded-md text-center transition border border-border">
                    Back to Dashboard
                </a>
            </div>
        </form>
    </div>
</div>

<script>
// Show/hide custom business type field
const businessTypeSelect = document.getElementById('business_type_id');
const customTypeDiv = document.getElementById('custom_type_div');
const customTypeInput = document.getElementById('custom_business_type');

businessTypeSelect.addEventListener('change', function() {
    if (this.value === 'other') {
        customTypeDiv.classList.remove('hidden');
        customTypeInput.required = true;
    } else {
        customTypeDiv.classList.add('hidden');
        customTypeInput.required = false;
    }
});

// Filter business types based on selected industry
const industrySelect = document.getElementById('industry_id');
const allTypes = {{ business_types | tojson }};

industrySelect.addEventListener('change', function() {
    const industryId = this.value;
    
    // Clear existing options except "Other"
    businessTypeSelect.innerHTML = '<option value="">Select Business Type</option><option value="other">Other</option>';
    
    // Add filtered business types
    const filteredTypes = allTypes.filter(type => type.industry_id === industryId);
    
    filteredTypes.forEach(type => {
        const option = document.createElement('option');
        option.value = type.id;
        option.textContent = type.name;
        if (type.id === '{{ business.business_type_id }}') {
            option.selected = true;
        }
        businessTypeSelect.appendChild(option);
    });
});

// Trigger change on load to populate business types
if (industrySelect.value) {
    industrySelect.dispatchEvent(new Event('change'));
}
</script>
{% endblock %}
